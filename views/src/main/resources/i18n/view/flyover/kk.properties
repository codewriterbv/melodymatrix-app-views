title=Ноталар – 3D ұшып өту
description=Қағаз парағындағы партитура 3D форматында: камера жылжып өтеді, ал жарқыраған шарлар ойналған сайын нотадан нотаға секіреді.
flyover.label.waiting=Шарлардың ноталарға секіргенін көру үшін жазбаны ойнатуды бастаңыз немесе өзіңіз ойнаңыз.
flyover.label.no3d=Бұл компьютерде 3D графика қолжетімсіз, сондықтан ұшып өту көрінісін көрсету мүмкін емес.
