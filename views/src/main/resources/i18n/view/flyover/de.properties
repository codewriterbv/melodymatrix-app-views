title=Noten – 3D-Überflug
description=Die Partitur auf einem Blatt Papier in 3D: Eine Kamera gleitet mit, während leuchtende Bälle von Note zu Note springen, sobald sie gespielt werden.
flyover.label.waiting=Starte die Wiedergabe einer Aufnahme oder spiele selbst, um die Bälle über die Noten springen zu sehen.
flyover.label.no3d=3D-Grafik ist auf diesem Computer nicht verfügbar, daher kann die Überflugansicht nicht angezeigt werden.
