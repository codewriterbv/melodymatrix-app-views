title=Bladmuziek – 3D-overvlucht
description=De partituur op een vel papier in 3D: een camera glijdt mee terwijl gloeiende balletjes van noot naar noot springen zodra ze gespeeld worden.
flyover.label.waiting=Start het afspelen van een opname, of speel zelf, om de balletjes over de noten te zien springen.
flyover.label.no3d=3D-graphics zijn niet beschikbaar op deze computer, dus de overvlucht kan niet getoond worden.
