title=Nuty – przelot 3D
description=Partytura na kartce papieru w 3D: kamera sunie nad nią, a świecące kulki skaczą od nuty do nuty, gdy są grane.
flyover.label.waiting=Rozpocznij odtwarzanie nagrania lub zagraj, aby zobaczyć kulki skaczące po nutach.
flyover.label.no3d=Grafika 3D nie jest dostępna na tym komputerze, więc widoku przelotu nie można wyświetlić.
