title=Spartito – sorvolo 3D
description=Lo spartito su un foglio di carta in 3D: una telecamera lo percorre mentre palline luminose saltano di nota in nota appena vengono suonate.
flyover.label.waiting=Avvia la riproduzione di una registrazione, o suona, per vedere le palline saltare sulle note.
flyover.label.no3d=La grafica 3D non è disponibile su questo computer, quindi la vista di sorvolo non può essere mostrata.
