title=Spartito – scorrevole
description=Lo spartito su un’unica riga che scorre sotto un cursore fisso e segue una registrazione, una lezione o la tua esecuzione. Ideale per suonare insieme.
learnstrip.label.waiting=Avvia una registrazione o una lezione, oppure suona sulla tua tastiera MIDI, per vedere scorrere le note.
