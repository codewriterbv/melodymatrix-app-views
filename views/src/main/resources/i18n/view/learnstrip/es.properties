title=Partitura – desplazable
description=La partitura en una sola línea que se desplaza bajo un cursor fijo y sigue una grabación, una lección o tu propia interpretación. Ideal para tocar a la vez.
learnstrip.label.waiting=Inicia una grabación o una lección, o toca en tu teclado MIDI, para ver pasar las notas.
