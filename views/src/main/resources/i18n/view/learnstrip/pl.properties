title=Nuty – przewijane
description=Partytura w jednej linii, przewijana pod nieruchomym kursorem i podążająca za nagraniem, lekcją lub twoją własną grą. Idealna do wspólnego grania.
learnstrip.label.waiting=Uruchom nagranie lub lekcję albo zagraj na klawiaturze MIDI, aby zobaczyć przesuwające się nuty.
