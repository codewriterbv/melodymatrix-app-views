title=Noten – Laufband
description=Die Partitur auf einer Zeile, die unter einem festen Cursor durchläuft und einer Aufnahme, einer Lektion oder deinem eigenen Spiel folgt. Ideal zum Mitspielen.
learnstrip.label.waiting=Starte eine Aufnahme oder Lektion oder spiele auf deinem MIDI-Keyboard, um die Noten vorbeiziehen zu sehen.
